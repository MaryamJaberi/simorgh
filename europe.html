<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>پَرِ سیمرغ — ارائه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Lalezar&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#f5f5f3; --surface:#fff; --surface2:#eceae5; --line:#dcd8d0;
  --text:#16181d; --muted:#63697a; --zar:#a8791c; --shangarf:#b1402f; --firuze:#1e7d70;
  --lajvard:#2f5390; --shadow:0 2px 18px rgba(20,25,35,.08);
  /* گوگل‌فونت فقط بهبود است؛ اگر نیامد این‌ها می‌گیرند و چیزی خراب نمی‌شود */
  --fa:"Vazirmatn","IRANSans","Sahel","Segoe UI","Tahoma",system-ui,sans-serif;
  --en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --disp:"Lalezar","Vazirmatn","Tahoma",system-ui,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#161a21; --surface2:#1c212a; --line:#2b323e;
  --text:#e9eaee; --muted:#98a1ae; --zar:#d9a441; --shangarf:#e0705c; --firuze:#4cc7b4;
  --lajvard:#7ba3e8; --shadow:0 2px 22px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface2:#1c212a; --line:#2b323e;
  --text:#e9eaee; --muted:#98a1ae; --zar:#d9a441; --shangarf:#e0705c; --firuze:#4cc7b4;
  --lajvard:#7ba3e8; --shadow:0 2px 22px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fa);
  font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
html[lang="en"] body{font-family:var(--en);line-height:1.65}

/* ══ نوار بالا ══ */
#bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#bar .in{max-width:1400px;margin:0 auto;padding:9px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#brand{font-family:var(--disp);font-size:1.12rem;color:var(--zar);margin-inline-end:auto;
  white-space:nowrap;font-weight:400}
html[lang="en"] #brand{font-family:var(--en);font-weight:700}
.btn{cursor:pointer;font-family:inherit;font-size:.83rem;font-weight:600;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  padding:7px 13px;transition:.15s;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--zar)}
.btn.on{background:var(--zar);border-color:var(--zar);color:#12161f}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg .btn{border:0;border-radius:0;min-height:36px}
#prog{height:3px;background:var(--surface2)}
#prog i{display:block;height:100%;width:0;background:var(--zar);transition:width .3s}

/* ══ چیدمان کلی ══ */
main{max-width:1400px;margin:0 auto;padding:0 14px}

/* ══ حالت روایت ══ */
#story{padding:22px 0 90px}
#story .sl{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:clamp(22px,4vw,44px);margin-bottom:20px;box-shadow:var(--shadow);scroll-margin-top:70px}
#story .sl.hide{display:none}

/* ══ حالت ارائه ══ */
#present{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);
  flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
body.presenting #present{display:flex}
body.presenting #bar,body.presenting #story{display:none}
#stage{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;
  padding:clamp(20px,4vw,64px)}
#stage .sl{max-width:1100px;width:100%}
#pfoot{border-top:1px solid var(--line);background:var(--surface);
  padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dots{display:flex;gap:5px;flex:1;flex-wrap:wrap;min-width:80px}
#dots b{width:9px;height:9px;border-radius:99px;background:var(--line);cursor:pointer;display:block;
  transition:.2s;border:0;padding:0}
#dots b.on{background:var(--zar);transform:scale(1.35)}
#counter{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);white-space:nowrap}
#timer{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--zar);font-weight:700;
  white-space:nowrap;min-width:52px;text-align:center}

/* ══ محتوای اسلاید ══ */
.sl .step{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.1em;
  color:var(--bg);background:var(--zar);border-radius:99px;padding:3px 11px;
  font-variant-numeric:tabular-nums;margin-bottom:12px}
.sl h2{font-family:var(--disp);font-weight:400;line-height:1.25;margin:0 0 8px;
  font-size:clamp(1.7rem,4.6vw,3.3rem)}
html[lang="en"] .sl h2{font-family:var(--en);font-weight:700;line-height:1.14}
.sl .sub{color:var(--zar);font-size:clamp(.95rem,1.7vw,1.22rem);margin:0 0 22px;font-weight:600}
.sl ul{margin:0;padding:0;list-style:none;display:grid;gap:clamp(12px,1.6vw,18px)}
.sl li{font-size:clamp(1rem,1.55vw,1.28rem);line-height:1.85;padding-inline-start:20px;
  position:relative;max-width:78ch}
html[lang="en"] .sl li{line-height:1.62}
.sl li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;
  width:7px;height:7px;border-radius:99px;background:var(--zar)}
.sl li b{color:var(--zar);font-weight:700}
.sl[data-kind="title"]{text-align:center}
.sl[data-kind="title"] li{padding:0;max-width:none}
.sl[data-kind="title"] li::before{display:none}
.sl[data-kind="title"] ul{gap:10px}
.sl[data-kind="quote"] li:first-child{font-size:clamp(1.1rem,2.1vw,1.6rem);
  border-inline-start:3px solid var(--zar);padding-inline-start:20px;font-style:italic;color:var(--text)}
.sl[data-kind="quote"] li:first-child::before{display:none}
.sl[data-kind="stat"] li:nth-child(-n+3){font-weight:600}
.sl[data-kind="ask"] ul{gap:9px}
.sl[data-kind="ask"] li{background:var(--surface2);border-radius:12px;padding:12px 17px;
  padding-inline-start:17px;font-size:clamp(.95rem,1.4vw,1.14rem)}
.sl[data-kind="ask"] li::before{display:none}

/* ══ یادداشت گوینده ══ */
.notes{margin-top:26px;border-top:1px dashed var(--line);padding-top:14px;
  color:var(--muted);font-size:.9rem;line-height:1.8;display:none}
body.notes-on .notes{display:block}
.notes::before{content:"یادداشتِ گوینده";display:block;font-size:.68rem;letter-spacing:.1em;
  font-weight:700;color:var(--zar);margin-bottom:5px}
html[lang="en"] .notes::before{content:"Speaker notes"}

/* ══ منابع ══ */
#src{max-width:1400px;margin:0 auto;padding:0 14px 80px}
#src h3{font-size:1rem;color:var(--zar);margin:0 0 12px}
#src ol{margin:0;padding-inline-start:22px;color:var(--muted);font-size:.86rem;line-height:2}
#src a{color:var(--lajvard)}

/* ══ پنل مدیریت ══ */
#admin{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto}
body.admin-on #admin{display:block}
#admin .in{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
#admin h2{font-size:1.3rem;margin:0 0 4px}
#admin .lead{color:var(--muted);font-size:.88rem;margin:0 0 20px}
.ed{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
.ed>header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ed .id{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted);
  background:var(--surface2);padding:2px 8px;border-radius:6px;direction:ltr}
.ed .ttl{font-weight:700;flex:1;font-size:.95rem}
.ed.off{opacity:.5}
.ed label{display:block;font-size:.72rem;color:var(--muted);margin:9px 0 4px;font-weight:600}
.ed input,.ed textarea{width:100%;font-family:inherit;font-size:.9rem;line-height:1.75;
  padding:9px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);resize:vertical}
.ed textarea{min-height:86px}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.ed .two{grid-template-columns:1fr}}
.ed .pane{border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.ed .pane>b{font-size:.75rem;color:var(--zar);letter-spacing:.06em}
.ed .pane.en{direction:ltr;text-align:left}
.mini{padding:5px 10px;font-size:.76rem;min-height:32px}

/* ══ تست ══ */
#tests{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto}
body.tests-on #tests{display:block}
#tests .in{max-width:900px;margin:0 auto;padding:20px 16px 90px}
#tres{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;direction:ltr;
  text-align:left;background:var(--surface2);border-radius:12px;padding:14px 16px;
  white-space:pre-wrap;line-height:1.75;margin-top:14px}
.t-pass{color:var(--firuze)} .t-fail{color:var(--shangarf);font-weight:700}
.t-head{color:var(--zar);font-weight:700}

/* ══ ریسپانسیو ══ */
@media(max-width:640px){
  body{font-size:15px}
  #brand{font-size:1rem}
  .btn{padding:7px 10px;font-size:.78rem}
  #story{padding:14px 0 70px}
  .sl .step{font-size:.64rem}
}
@media(min-width:1600px){
  #stage .sl{max-width:1280px}
  .sl li{font-size:1.34rem}
}
@media(max-height:520px) and (orientation:landscape){
  #stage{padding:14px 22px}
  .sl h2{font-size:clamp(1.3rem,3.6vh,2rem);margin-bottom:4px}
  .sl .sub{margin-bottom:10px;font-size:.9rem}
  .sl ul{gap:7px}
  .sl li{font-size:.94rem;line-height:1.55}
}
@media print{
  #bar,#pfoot,#admin,#tests,#prog{display:none!important}
  body{background:#fff;color:#000}
  body.presenting #present{position:static;display:block}
  body.presenting #story{display:block}
  .sl{break-inside:avoid;page-break-inside:avoid;border:0;box-shadow:none;
      border-bottom:1px solid #ccc;border-radius:0}
  .notes{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<body>

<div id="bar">
  <div class="in">
    <span id="brand">پَرِ سیمرغ</span>
    <div class="seg" role="group" aria-label="زبان">
      <button class="btn on" id="lfa" data-lang="fa">فارسی</button>
      <button class="btn" id="len" data-lang="en">English</button>
    </div>
    <button class="btn" id="bpresent">▶ ارائه</button>
    <button class="btn" id="bnotes">یادداشت</button>
    <button class="btn" id="badmin">پنل</button>
    <button class="btn" id="bprint">چاپ</button>
    <button class="btn" id="btests">تست</button>
    <button class="btn" id="btheme" title="روشن/تاریک">◐</button>
  </div>
  <div id="prog"><i id="progbar"></i></div>
</div>

<main>
  <div id="story"></div>
</main>

<div id="src"></div>

<!-- ══ ارائه ══ -->
<div id="present">
  <div id="stage"><div id="pslide"></div></div>
  <div id="pfoot">
    <button class="btn mini" id="pprev">‹</button>
    <button class="btn mini" id="pnext">›</button>
    <div id="dots"></div>
    <span id="counter">۱/۱</span>
    <span id="timer">۰۰:۰۰</span>
    <button class="btn mini" id="ptimer">شروع</button>
    <button class="btn mini" id="pnotes">یادداشت</button>
    <button class="btn mini" id="pfull">تمام‌صفحه</button>
    <button class="btn mini" id="pexit">خروج</button>
  </div>
</div>

<!-- ══ پنل ══ -->
<div id="admin">
  <div class="in">
    <h2 id="adm-h">پنلِ محتوا</h2>
    <p class="lead" id="adm-l">هر چیزی این‌جا عوض کنید، فوری در ارائه اعمال می‌شود و در همین مرورگر ذخیره می‌ماند.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px">
      <button class="btn" id="aclose">بازگشت</button>
      <button class="btn" id="aexport">خروجی JSON</button>
      <button class="btn" id="aimport">ورودی JSON</button>
      <button class="btn" id="areset">بازگشت به نسخهٔ اصلی</button>
      <input type="file" id="afile" accept=".json,application/json" hidden>
      <span id="asave" style="color:var(--muted);font-size:.82rem;align-self:center"></span>
    </div>
    <div id="alist"></div>
  </div>
</div>

<!-- ══ تست ══ -->
<div id="tests">
  <div class="in">
    <h2>تستِ خودکارِ درون‌برنامه‌ای</h2>
    <p class="lead">این‌ها همان ادعاهایی‌اند که برنامه باید همیشه برآورده کند. قبل از هر ارائهٔ مهم یک بار بزنید.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" id="trun">اجرای تست‌ها</button>
      <button class="btn" id="tclose">بازگشت</button>
    </div>
    <pre id="tres">هنوز اجرا نشده.</pre>
  </div>
</div>

         "**۶. دعوت کنید و گوش بدهید.** پارلمان، دانشگاه، اتحادیه، شورای شهر. همین که ایرانی‌ها بتوانند خودشان حرف بزنند، بخشی از راه‌حل است."],
       notes:"برای هر بند یک «کارِ امروز» بگو. مثلاً: «امشب یک ایمیل به نمایندهٔ منطقه‌تان بزنید و همان یک سؤالِ بندِ اول را بپرسید.» درخواستِ مبهم، هیچ‌کس را تکان نمی‌دهد." },
  en:{ t:"Six concrete things you can do",
       sub:"None of them requires a war",
       body:[
         "**1 · Demand enforcement.** The Union decided in February 2026. Now ask your representative who in your country is responsible for enforcing the asset freeze, and what they have done so far.",
         "**2 · Protect exiled journalists.** The people targeted in London, Paris and Berlin are your citizens. Police protection for them is a small line item.",
         "**3 · Stop trading for hostages.** Every exchange creates the next market. Ask your own government this, not me.",
         "**4 · Visas and bank accounts.** A civil-society activist who gets out of Iran often can get neither a visa nor a bank account. That is fixed by a circular, not a budget.",
         "**5 · Keep independent Persian-language media alive.** It is the cheapest counter-disinformation instrument in existence.",
         "**6 · Invite and listen.** Parliament, university, trade union, city council. Iranians being able to speak for themselves is already part of the solution."],
       notes:"Attach a 'tonight' action to each. E.g. 'Send one email to your MP tonight and ask exactly the question in point one.' A vague ask moves nobody." } },

/* ─── ۱۳ · سؤال‌های سخت ─── */
{ id:"hard", kind:"qa",
  fa:{ t:"میزِ سؤال‌های سخت",
       sub:"این‌ها را از تو خواهند پرسید — جوابش را آماده داشته باش",
       body:[
         "**«پادشاهیِ قبلی هم سرکوب می‌کرد. ساواک.»** — درست است، و انکارش اعتبارت را می‌برد. بگو: برای همین است که حرف از پادشاهیِ مشروطه است، با پارلمان و قانونِ اساسیِ نو و دادگاهِ مستقل؛ و برای همین است که مسیر از رفراندوم می‌گذرد، نه از ادعای حق.",
         "**«جامعهٔ تبعیدی تکه‌تکه است. کردها و جمهوری‌خواهان مخالف‌اند.»** — درست است. بگو: و درست به همین دلیل کسی حق ندارد نتیجه را از پیش تعیین کند. اختلاف، دلیلِ رفراندوم است نه مانعش.",
         "**«شما ساختارِ گذار ندارید.»** — منتقدانِ اروپایی همین را گفته‌اند. اگر جوابِ مشخص نداری، بگو نداریم و داریم می‌سازیم. صداقت این‌جا از شعار قوی‌تر است.",
         "**«این همان تغییرِ رژیمِ آمریکایی است.»** — به اسلاید ضدِ امپریالیسم برگرد. تفاوتِ «تحریمِ دستگاه» با «حملهٔ نظامی» را روشن بگو، و موضعِ خودت را دربارهٔ حملهٔ نظامی صریح اعلام کن. ابهام این‌جا کشنده است.",
         "**«چرا ما باید هزینه بدهیم؟»** — به اسلاید هزینه برگرد. شما دارید همین حالا هزینه می‌دهید؛ فقط بابتِ نتیجه، نه بابتِ علت."],
       notes:"این اسلاید را در ارائهٔ رسمی رد کن و برای پرسش‌وپاسخ نگه دار. ولی حفظش کن. سالن وقتی می‌بیند جوابِ سختِ سؤالِ سختش را داری، تازه باورت می‌کند." },
  en:{ t:"The hard questions",
       sub:"They will ask you these — have the answers ready",
       body:[
         "**\"The old monarchy repressed too. SAVAK.\"** — True, and denying it destroys your credibility. Say: that is precisely why the proposal is a constitutional monarchy, with a parliament, a new constitution and independent courts; and why the route runs through a referendum, not a claim of right.",
         "**\"The exile community is fragmented. Kurds and republicans object.\"** — True. Say: and that is exactly why nobody may decide the outcome in advance. Disagreement is the reason for a referendum, not an obstacle to it.",
         "**\"You have no transitional structure.\"** — European critics have said this. If you do not have a specific answer, say you do not and that it is being built. Honesty beats slogans here.",
         "**\"This is American regime change.\"** — Go back to the anti-imperialism slide. Draw the line between sanctioning an apparatus and military attack, and state your own position on military attack explicitly. Ambiguity is fatal here.",
         "**\"Why should we pay for this?\"** — Go back to the cost slide. You are already paying — for the consequence, not the cause."],
       notes:"Skip this slide in the formal talk and keep it for Q&A. But memorise it. A room believes you only once it sees you have the hard answer to its hard question." } },

/* ─── ۱۴ · بستن ─── */
{ id:"close", kind:"title",
  fa:{ t:"پَر",
       sub:"در شاهنامه، سیمرغ پَری می‌دهد و می‌گوید: اگر روزی درماندی، بسوزانش. می‌آیم.",
       body:[
         "سیمرغ هیچ‌وقت به‌جای زال نمی‌جنگد. فقط وقتی می‌آید که زال خودش پَر را بسوزاند.",
         "ما پَر را می‌سوزانیم. این کارِ ماست و از کسی نمی‌خواهیمش.",
         "از شما فقط این را می‌خواهیم: کسی که دارد پَر را می‌سوزاند، شبانه در خیابانِ شما کشته نشود.",
         "و مادربزرگم دوازده کیلومتر رفت. مادرم سیصد. من چهار هزار.",
         "دخترم هیچ‌جا نرود."],
       notes:"جملهٔ آخر را بگو و ساکت بایست. نشمار، دست تکان نده، تشکر نکن. بگذار سکوت کار خودش را بکند. بعد بگو: «متشکرم.»" },
  en:{ t:"The feather",
       sub:"In the Shahnameh, the Simorgh gives a feather and says: if you are ever without help, burn it. I will come.",
       body:[
         "The Simorgh never fights in Zal's place. She comes only once Zal burns the feather himself.",
         "We will burn the feather. That is our work and we are not asking anyone else to do it.",
         "From you we ask only this: that the person burning it is not killed one night on your street.",
         "My grandmother travelled twelve kilometres. My mother, three hundred. I travelled four thousand.",
         "Let my daughter travel nowhere."],
       notes:"Say the last line and stand still. Do not count, do not gesture, do not thank. Let the silence work. Then: \"Thank you.\"" } }
];

const SOURCES = [
  { fa:"شورای اتحادیهٔ اروپا — قرار دادن سپاه در فهرست تروریستی، ۱۹ فوریهٔ ۲۰۲۶",
    en:"Council of the EU — IRGC designated a terrorist organisation, 19 Feb 2026",
    url:"https://www.consilium.europa.eu/en/press/press-releases/2026/02/19/eu-terrorist-list-council-designates-the-islamic-revolutionary-guard-corps-as-a-terrorist-organisation/" },
  { fa:"ICCT — عملیات برون‌مرزی ایران در اروپا: پیوند جنایی",
    en:"ICCT — Iranian External Operations in Europe: The Criminal Connection",
    url:"https://icct.nl/publication/iranian-external-operations-europe-criminal-connection" },
  { fa:"چتم هاوس — تحلیل تصمیم اتحادیهٔ اروپا",
    en:"Chatham House — The EU's IRGC terrorist designation marks a major shift on Iran",
    url:"https://www.chathamhouse.org/2026/02/eus-irgc-terrorist-designation-marks-major-shift-iran" },
  { fa:"بیانیهٔ مشترک ۱۴ کشور دربارهٔ توطئه‌های ترور و ربایش، ۲۰۲۵",
    en:"Joint statement of 14 countries on Iranian state threat activity, 2025",
    url:"https://www.aljazeera.com/news/2025/7/31/uk-us-and-allies-accuse-iran-of-cross-border-assassination-plots" },
  { fa:"ایران اینترنشنال — مواضع شاهزاده رضا پهلوی دربارهٔ رفراندوم و مجلس مؤسسان، ژانویهٔ ۲۰۲۶",
    en:"Iran International — Reza Pahlavi on referendum and constituent assembly, Jan 2026",
    url:"https://www.iranintl.com/en/202601070595" },
  { fa:"هوور — سفر اروپایی بهار ۲۰۲۶ و نقدهای مطرح‌شده",
    en:"Hoover Institution — Pahlavi's spring 2026 European tour and the criticisms raised",
    url:"https://www.hoover.org/research/prince-reza-pahlavis-european-tour-spring-2026-media-controversies-diaspora-conflicts-and" },
  { fa:"بروگل — هزینهٔ دفاع هوایی و معنایش برای اروپا",
    en:"Bruegel — The costs of air defence in the Iran conflict and what they mean for Europe",
    url:"https://www.bruegel.org/first-glance/costs-and-failures-air-defence-iran-conflict-and-what-they-mean-europe" }

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var KEY="simorgh_eu_deck_v1", PKEY="simorgh_eu_prefs_v1";

/* ══ وضعیت ══ */
var state={lang:"fa",idx:0,notes:false,timer:0,ticking:null};
var deck=null;

function clone(o){return JSON.parse(JSON.stringify(o))}
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

function loadDeck(){
  var raw=safeGet(KEY);
  if(raw){
    try{
      var d=JSON.parse(raw);
      if(Array.isArray(d)&&d.length&&d[0].fa&&d[0].en) return d;
    }catch(e){}
  }
  return clone(DECK);
}
function saveDeck(){
  var ok=safeSet(KEY,JSON.stringify(deck));
  var el=$("#asave");
  if(el) el.textContent = ok ? (state.lang==="fa"?"ذخیره شد ✓":"Saved ✓")
                             : (state.lang==="fa"?"ذخیره نشد (حافظهٔ مرورگر بسته است)":"Not saved (storage unavailable)");
  return ok;
}
function loadPrefs(){
  var raw=safeGet(PKEY); if(!raw) return;
  try{var p=JSON.parse(raw);
    if(p.lang==="fa"||p.lang==="en") state.lang=p.lang;
    if(typeof p.notes==="boolean") state.notes=p.notes;
    if(p.theme==="dark"||p.theme==="light") document.documentElement.setAttribute("data-theme",p.theme);
  }catch(e){}
}
function savePrefs(){
  safeSet(PKEY,JSON.stringify({lang:state.lang,notes:state.notes,
    theme:document.documentElement.getAttribute("data-theme")||""}));
}

/* ══ کمکی ══ */
var FA="۰۱۲۳۴۵۶۷۸۹";
function num(n){
  n=String(n);
  return state.lang==="fa" ? n.replace(/[0-9]/g,function(d){return FA[+d]}) : n;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function md(s){ /* فقط **پررنگ** — عمداً محدود، تا ورودی کاربر نتواند HTML تزریق کند */
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
}
function visible(){return deck.filter(function(s){return s.on!==false})}
function L(s){return s[state.lang]||s.fa}

/* ══ ساخت اسلاید ══ */
function slideHTML(s,i,total){
  var c=L(s), lis=(c.body||[]).map(function(x){return "<li>"+md(x)+"</li>"}).join("");
  return '<div class="sl" data-kind="'+esc(s.kind||"list")+'" data-id="'+esc(s.id)+'" id="sl-'+esc(s.id)+'">'
    + '<span class="step">'+(state.lang==="fa"
        ? num(i+1)+" از "+num(total)
        : num(i+1)+" / "+num(total))+'</span>'
    + '<h2>'+esc(c.t||"")+'</h2>'
    + (c.sub?'<p class="sub">'+esc(c.sub)+'</p>':"")
    + '<ul>'+lis+'</ul>'
    + (c.notes?'<div class="notes">'+esc(c.notes)+'</div>':"")
    + '</div>';
}

function renderStory(){
  var v=visible();
  $("#story").innerHTML = v.map(function(s,i){return slideHTML(s,i,v.length)}).join("");
  renderSources();
}
function renderSources(){
  var items=SOURCES.map(function(s){
    return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s[state.lang]||s.fa)+'</a></li>';
  }).join("");
  $("#src").innerHTML='<h3>'+(state.lang==="fa"?"منابع":"Sources")+'</h3><ol>'+items+'</ol>';
}
function renderPresent(){
  var v=visible();
  if(!v.length){$("#pslide").innerHTML="";return}
  if(state.idx>=v.length) state.idx=v.length-1;
  if(state.idx<0) state.idx=0;
  $("#pslide").innerHTML=slideHTML(v[state.idx],state.idx,v.length);
  $("#counter").textContent=num(state.idx+1)+"/"+num(v.length);
  $("#dots").innerHTML=v.map(function(s,i){
    return '<button type="button" aria-label="'+esc(L(s).t)+'" data-go="'+i+'"'
      +' class="'+(i===state.idx?"on":"")+'"></button>'}).join("")
      .replace(/<button/g,"<b role=\"button\"").replace(/<\/button>/g,"</b>");
  $("#progbar").style.width=(((state.idx+1)/v.length)*100).toFixed(1)+"%";
  $("#stage").scrollTop=0;
}
function renderAll(){ renderStory(); if(document.body.classList.contains("presenting")) renderPresent(); }

/* ══ زبان ══ */
function setLang(l){
  state.lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir = (l==="fa") ? "rtl" : "ltr";
  $("#lfa").classList.toggle("on",l==="fa");
  $("#len").classList.toggle("on",l==="en");
  var T={
    fa:{brand:"پَرِ سیمرغ",present:"▶ ارائه",notes:"یادداشت",admin:"پنل",print:"چاپ",tests:"تست",
        prev:"‹",next:"›",start:"شروع",stop:"توقف",full:"تمام‌صفحه",exit:"خروج",
        admH:"پنلِ محتوا",admL:"هر چیزی این‌جا عوض کنید، فوری در ارائه اعمال می‌شود و در همین مرورگر ذخیره می‌ماند.",
        back:"بازگشت",exp:"خروجی JSON",imp:"ورودی JSON",rst:"بازگشت به نسخهٔ اصلی"},
    en:{brand:"The Simorgh's Feather",present:"▶ Present",notes:"Notes",admin:"Editor",print:"Print",tests:"Tests",
        prev:"‹",next:"›",start:"Start",stop:"Stop",full:"Fullscreen",exit:"Exit",
        admH:"Content editor",admL:"Anything you change here applies to the talk immediately and stays in this browser.",
        back:"Back",exp:"Export JSON",imp:"Import JSON",rst:"Reset to original"}
  }[l];
  $("#brand").textContent=T.brand;
  $("#bpresent").textContent=T.present; $("#bnotes").textContent=T.notes;
  $("#badmin").textContent=T.admin; $("#bprint").textContent=T.print; $("#btests").textContent=T.tests;
  $("#pprev").textContent=T.prev; $("#pnext").textContent=T.next;
  $("#pfull").textContent=T.full; $("#pexit").textContent=T.exit;
  $("#pnotes").textContent=T.notes;
  $("#ptimer").textContent = state.ticking ? T.stop : T.start;
  $("#adm-h").textContent=T.admH; $("#adm-l").textContent=T.admL;
  $("#aclose").textContent=T.back; $("#aexport").textContent=T.exp;
  $("#aimport").textContent=T.imp; $("#areset").textContent=T.rst;
  renderAll();
  if(document.body.classList.contains("admin-on")) renderAdmin();
  savePrefs();
}

/* ══ ناوبری ارائه ══ */
function go(i){ state.idx=i; renderPresent(); }
function next(){ if(state.idx<visible().length-1) go(state.idx+1); }
function prev(){ if(state.idx>0) go(state.idx-1); }
function present(on){
  document.body.classList.toggle("presenting",on);
  if(on) renderPresent();
  else { $("#progbar").style.width="0%"; }
}

/* ══ تایمر ══ */
function fmt(s){
  var m=Math.floor(s/60), r=s%60;
  return num((m<10?"0":"")+m)+":"+num((r<10?"0":"")+r);
}
function toggleTimer(){
  var T=state.lang==="fa"?{a:"شروع",b:"توقف"}:{a:"Start",b:"Stop"};
  if(state.ticking){ clearInterval(state.ticking); state.ticking=null; $("#ptimer").textContent=T.a; }
  else{
    state.ticking=setInterval(function(){ state.timer++; $("#timer").textContent=fmt(state.timer); },1000);
    $("#ptimer").textContent=T.b;
  }
}

/* ══ پنل ══ */
function renderAdmin(){
  var box=$("#alist"); box.innerHTML="";
  deck.forEach(function(s,i){
    var d=document.createElement("div");
    d.className="ed"+(s.on===false?" off":"");
    d.innerHTML=
      '<header><span class="id">'+esc(s.id)+'</span>'
      +'<span class="ttl">'+esc(L(s).t||"")+'</span>'
      +'<button class="btn mini" data-act="up" data-i="'+i+'">▲</button>'
      +'<button class="btn mini" data-act="down" data-i="'+i+'">▼</button>'
      +'<button class="btn mini" data-act="toggle" data-i="'+i+'">'
        +(s.on===false?(state.lang==="fa"?"نمایش":"Show"):(state.lang==="fa"?"مخفی":"Hide"))+'</button>'
      +'</header>'
      +'<div class="two">'
        +pane(i,"fa","فارسی")
        +pane(i,"en","English")
      +'</div>';
    box.appendChild(d);
  });
}
function pane(i,lg,title){
  var c=deck[i][lg]||{t:"",sub:"",body:[],notes:""};
  var lab = lg==="fa"
    ? {t:"عنوان",s:"زیرعنوان",b:"بندها (هر خط یک بند · **پررنگ**)",n:"یادداشتِ گوینده"}
    : {t:"Title",s:"Subtitle",b:"Points (one per line · **bold**)",n:"Speaker notes"};
  return '<div class="pane '+lg+'"><b>'+title+'</b>'
    +'<label>'+lab.t+'</label><input data-i="'+i+'" data-lg="'+lg+'" data-f="t" value="'+esc(c.t||"")+'">'
    +'<label>'+lab.s+'</label><input data-i="'+i+'" data-lg="'+lg+'" data-f="sub" value="'+esc(c.sub||"")+'">'
    +'<label>'+lab.b+'</label><textarea data-i="'+i+'" data-lg="'+lg+'" data-f="body">'+esc((c.body||[]).join("\n"))+'</textarea>'
    +'<label>'+lab.n+'</label><textarea data-i="'+i+'" data-lg="'+lg+'" data-f="notes" style="min-height:60px">'+esc(c.notes||"")+'</textarea>'
    +'</div>';
}
$("#alist").addEventListener("input",function(e){
  var el=e.target, i=el.getAttribute("data-i"), lg=el.getAttribute("data-lg"), f=el.getAttribute("data-f");
  if(i===null||!lg||!f) return;
  i=+i;
  if(!deck[i][lg]) deck[i][lg]={t:"",sub:"",body:[],notes:""};
  deck[i][lg][f] = (f==="body") ? el.value.split("\n").filter(function(x){return x.trim()!==""}) : el.value;
  saveDeck(); renderAll();
});
$("#alist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]"); if(!b) return;
  var i=+b.getAttribute("data-i"), a=b.getAttribute("data-act");
  if(a==="up"&&i>0){ var t=deck[i-1]; deck[i-1]=deck[i]; deck[i]=t; }
  if(a==="down"&&i<deck.length-1){ var u=deck[i+1]; deck[i+1]=deck[i]; deck[i]=u; }
  if(a==="toggle") deck[i].on = (deck[i].on===false);
  saveDeck(); renderAdmin(); renderAll();
});

/* ══ ورودی / خروجی ══ */
$("#aexport").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(deck,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="simorgh-deck.json"; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
});
$("#aimport").addEventListener("click",function(){$("#afile").click()});
$("#afile").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!Array.isArray(d)||!d.length||!d[0].fa) throw new Error("shape");
      deck=d; saveDeck(); renderAdmin(); renderAll();
      $("#asave").textContent=state.lang==="fa"?"وارد شد ✓":"Imported ✓";
    }catch(err){
      $("#asave").textContent=state.lang==="fa"?"فایل معتبر نبود":"Invalid file";
    }
  };
  r.readAsText(f); e.target.value="";
});
$("#areset").addEventListener("click",function(){
  deck=clone(DECK); saveDeck(); renderAdmin(); renderAll();
  $("#asave").textContent=state.lang==="fa"?"به نسخهٔ اصلی برگشت ✓":"Reset ✓";
});

/* ══ دکمه‌ها ══ */
$("#lfa").addEventListener("click",function(){setLang("fa")});
$("#len").addEventListener("click",function(){setLang("en")});
$("#bpresent").addEventListener("click",function(){present(true)});
$("#pexit").addEventListener("click",function(){present(false)});
$("#pprev").addEventListener("click",prev);
$("#pnext").addEventListener("click",next);
$("#ptimer").addEventListener("click",toggleTimer);
$("#dots").addEventListener("click",function(e){
  var b=e.target.closest("[data-go]"); if(b) go(+b.getAttribute("data-go"));
});
function toggleNotes(){
  state.notes=!state.notes;
  document.body.classList.toggle("notes-on",state.notes);
  $("#bnotes").classList.toggle("on",state.notes);
  $("#pnotes").classList.toggle("on",state.notes);
  savePrefs();
}

$("#pnotes").addEventListener("click",toggleNotes);

$("#btheme").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var isDark = cur ? cur==="dark"
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.setAttribute("data-theme", isDark?"light":"dark");
  savePrefs();
});
$("#pfull").addEventListener("click",function(){
  if(!document.fullscreenElement){ if(document.documentElement.requestFullscreen)
      document.documentElement.requestFullscreen().catch(function(){}); }
  else if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
});

/* ══ کیبورد ══ */
document.addEventListener("keydown",function(e){
  if(e.target.closest("input,textarea")) return;
  if(document.body.classList.contains("admin-on")||document.body.classList.contains("tests-on")){
    if(e.key==="Escape"){document.body.classList.remove("admin-on","tests-on")}
    return;
  }
  var rtl = document.documentElement.dir==="rtl";
  if(e.key==="ArrowLeft"){ e.preventDefault(); rtl?next():prev(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); rtl?prev():next(); }
  else if(e.key===" "||e.key==="PageDown"){ e.preventDefault(); next(); }
  else if(e.key==="PageUp"){ e.preventDefault(); prev(); }
  else if(e.key==="Home"){ e.preventDefault(); go(0); }
  else if(e.key==="End"){ e.preventDefault(); go(visible().length-1); }
  else if(e.key==="Escape"){ present(false); }
  else if(e.key==="n"||e.key==="N"){ toggleNotes(); }
  else if(e.key==="p"||e.key==="P"){ present(!document.body.classList.contains("presenting")); }
});

/* ══ کشیدن انگشت ══ */
(function(){
  var x0=null,y0=null;
  var st=$("#stage");
  st.addEventListener("touchstart",function(e){
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  st.addEventListener("touchend",function(e){
    if(x0===null) return;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6){
      var rtl=document.documentElement.dir==="rtl";
      if(dx<0) rtl?prev():next(); else rtl?next():prev();
    }
    x0=null;y0=null;
  },{passive:true});
})();

/* ══ پیشرفتِ حالت روایت ══ */
window.addEventListener("scroll",function(){
  if(document.body.classList.contains("presenting")) return;
  var h=document.documentElement.scrollHeight-window.innerHeight;
  $("#progbar").style.width = h>0 ? ((window.scrollY/h)*100).toFixed(1)+"%" : "0%";
},{passive:true});

/* ══ تست‌های درون‌برنامه‌ای ══ */
var TESTS=[
 ["دادهٔ ارائه بارگذاری شده و ساختارش سالم است", function(){
   if(!Array.isArray(DECK)||DECK.length<10) throw new Error("DECK too small: "+(DECK||[]).length);
   DECK.forEach(function(s){
     if(!s.id) throw new Error("slide without id");
     ["fa","en"].forEach(function(l){
       if(!s[l]) throw new Error(s.id+" missing "+l);
       if(!s[l].t) throw new Error(s.id+"."+l+" missing title");
       if(!Array.isArray(s[l].body)||!s[l].body.length) throw new Error(s.id+"."+l+" empty body");
     });
   });
   return DECK.length+" slides";
 }],
 ["شناسه‌ها یکتا هستند", function(){
   var seen={}; DECK.forEach(function(s){ if(seen[s.id]) throw new Error("dup id "+s.id); seen[s.id]=1; });
   return "ok";
 }],
 ["فارسی و انگلیسی تعداد بندِ برابر دارند", function(){
   var bad=DECK.filter(function(s){return s.fa.body.length!==s.en.body.length});
   if(bad.length) throw new Error("mismatch: "+bad.map(function(s){return s.id}).join(","));
   return "ok";
 }],
 ["هر اسلاید یادداشتِ گوینده دارد", function(){
   var bad=DECK.filter(function(s){return !s.fa.notes||!s.en.notes});
   if(bad.length) throw new Error("no notes: "+bad.map(function(s){return s.id}).join(","));
   return "ok";
 }],
 ["منابع لینکِ https دارند", function(){
   if(!SOURCES.length) throw new Error("no sources");
   SOURCES.forEach(function(s){ if(!/^https:\/\//.test(s.url)) throw new Error("bad url "+s.url); });
   return SOURCES.length+" sources";
 }],
 ["رندرِ روایت همهٔ اسلایدهای فعال را می‌سازد", function(){
   renderStory();
   var n=document.querySelectorAll("#story .sl").length;
   if(n!==visible().length) throw new Error("rendered "+n+" expected "+visible().length);
   return n+" rendered";
 }],
 ["ورودی کاربر به HTML تبدیل نمی‌شود (ضدِ تزریق)", function(){
   var probe='<img src=x onerror="window.__XSS=1">';
   var out=md(probe);
   if(/<img/i.test(out)) throw new Error("markup leaked");
   if(window.__XSS) throw new Error("script executed");
   return "escaped";
 }],
 ["**پررنگ** به تگِ b تبدیل می‌شود", function(){
   if(md("a **b** c").indexOf("<b>b</b>")<0) throw new Error("bold failed");
   return "ok";
 }],
 ["تعویضِ زبان جهتِ صفحه را عوض می‌کند", function(){
   var before=state.lang;
   setLang("en"); if(document.documentElement.dir!=="ltr") throw new Error("en not ltr");
   setLang("fa"); if(document.documentElement.dir!=="rtl") throw new Error("fa not rtl");
   setLang(before);
   return "rtl/ltr ok";
 }],
 ["ناوبری ارائه از مرزها بیرون نمی‌زند", function(){
   var keep=state.idx;
   go(0); prev(); if(state.idx!==0) throw new Error("underflow "+state.idx);
   go(visible().length-1); next();
   if(state.idx!==visible().length-1) throw new Error("overflow "+state.idx);
   go(keep);
   return "bounded";
 }],
 ["شمارندهٔ اسلاید با زبان هماهنگ است", function(){
   var keep=state.idx, kl=state.lang;
   setLang("fa"); go(0); renderPresent();
   if($("#counter").textContent.indexOf("۱")<0) throw new Error("fa digits missing: "+$("#counter").textContent);
   setLang("en"); renderPresent();
   if($("#counter").textContent.indexOf("1")<0) throw new Error("en digits missing: "+$("#counter").textContent);
   setLang(kl); go(keep);
   return "ok";
 }],
 ["مخفی کردنِ اسلاید از ارائه حذفش می‌کند", function(){
   var n0=visible().length;
   deck[1].on=false;
   var n1=visible().length;
   deck[1].on=true;
   if(n1!==n0-1) throw new Error("hide had no effect: "+n0+"→"+n1);
   return "ok";
 }],
 ["ویرایش در پنل روی خروجی اثر می‌گذارد", function(){
   var orig=deck[0].fa.t;
   deck[0].fa.t="__TEST__"; renderStory();
   var has=$("#story").textContent.indexOf("__TEST__")>=0;
   deck[0].fa.t=orig; renderStory();
   if(!has) throw new Error("edit not reflected");
   return "ok";
 }],
 ["حافظهٔ مرورگر بدونِ خطا پاسخ می‌دهد", function(){
   var ok=safeSet("__probe__","1");
   try{localStorage.removeItem("__probe__")}catch(e){}
   return ok?"writable":"read-only (app still works)";
 }],
 ["تایمر درست قالب‌بندی می‌شود", function(){
   var kl=state.lang; setLang("en");
   if(fmt(0)!=="00:00") throw new Error("fmt(0)="+fmt(0));
   if(fmt(75)!=="01:15") throw new Error("fmt(75)="+fmt(75));
   setLang(kl);
   return "ok";
 }],
 ["اسلایدِ حساس دربارهٔ افراط‌گرایی، جملهٔ تفکیک را دارد", function(){
   var s=DECK.filter(function(x){return x.id==="extremism"})[0];
   if(!s) throw new Error("slide missing");
   if(s.fa.body[0].indexOf("نه یک دین")<0) throw new Error("FA safeguard line missing");
   if(s.en.body[0].indexOf("not a religion")<0) throw new Error("EN safeguard line missing");
   return "safeguard present";
 }]
];
function runTests(){
  var out=$("#tres"); out.innerHTML="";
  var pass=0,fail=0;
  function line(txt,cls){var s=document.createElement("span");
    if(cls)s.className=cls; s.textContent=txt+"\n"; out.appendChild(s);}
  line("in-app test run — "+new Date().toISOString(),"t-head");
  line("");
  TESTS.forEach(function(t,i){
    try{ var r=t[1](); pass++; line("PASS  "+(i+1)+". "+t[0]+(r?"  ("+r+")":""),"t-pass"); }
    catch(e){ fail++; line("FAIL  "+(i+1)+". "+t[0]+"  →  "+e.message,"t-fail"); }
  });
  line("");
  line("passed "+pass+" / "+(pass+fail)+(fail?("   FAILURES: "+fail):"   all green"),fail?"t-fail":"t-head");
  return {pass:pass,fail:fail};
}
$("#trun").addEventListener("click",runTests);
window.__runTests=runTests;
